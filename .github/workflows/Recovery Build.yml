# UNTESTED: nobody has run this end to end yet. Read the notes at the bottom.

name: OrangeFox Build (roadstr)

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE_URL:
        description: Device tree git URL (public repo)
        type: string
        required: true
        default: https://github.com/Retardpro/android_device_motorola_roadstr
      DEVICE_TREE_BRANCH:
        description: Device tree branch (leave blank for the repo's default branch)
        type: string
        required: false
        default: ""
      FOX_BRANCH:
        description: OrangeFox manifest branch passed to orangefox_sync.sh --branch
        type: string
        required: true
        default: "14.1"
      LUNCH_CHOICE:
        description: lunch target (must be listed in AndroidProducts.mk)
        type: string
        required: true
        default: fox_roadstr-ap2a-eng
      BUILD_TARGET:
        description: What to build (tree has a dedicated recovery partition)
        type: choice
        options:
          - recoveryimage
          - vendorbootimage
          - bootimage
        required: true
        default: recoveryimage
      EXTRA_EXPORTS:
        description: Space-separated KEY=VALUE exports (FOX_* vars MUST go here, not in .mk files)
        type: string
        required: false
        default: "FOX_AB_DEVICE=1 FOX_VIRTUAL_AB_DEVICE=1 OF_DEFAULT_KEYMASTER_VERSION=4.1"

permissions:
  contents: read

env:
  DEVICE_NAME: roadstr
  DEVICE_PATH: device/motorola/roadstr

jobs:
  build:
    # Only the repo owner can trigger a build
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    timeout-minutes: 350   # hard job limit on hosted runners is 360

    steps:
      # Must run BEFORE checkout: it re-mounts $GITHUB_WORKSPACE on a big merged volume
      - name: Free up disk space and add swap
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 16384
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Check out this repo (for the patch)
        uses: actions/checkout@v4
        with:
          path: actions-repo

      - name: Clone device tree
        env:
          TREE_URL: ${{ inputs.DEVICE_TREE_URL }}
          TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
        run: |
          case "$TREE_URL" in
            https://github.com/*|https://gitlab.com/*) ;;
            *) echo "::error::DEVICE_TREE_URL must start with https://github.com/ or https://gitlab.com/"; exit 1 ;;
          esac
          git clone --depth 1 ${TREE_BRANCH:+-b "$TREE_BRANCH"} "$TREE_URL" tree
          git -C tree log -1 --format='Tree commit: %H %s'

      - name: Preflight checks on the tree (fails fast, before the long sync)
        env:
          LUNCH_CHOICE: ${{ inputs.LUNCH_CHOICE }}
        run: |
          cd tree
          fail=0
          # 1. lunch target must exist in AndroidProducts.mk
          if ! grep -q "${LUNCH_CHOICE}" AndroidProducts.mk; then
            echo "::error::'${LUNCH_CHOICE}' is not in AndroidProducts.mk"; fail=1
          fi
          # 2. kernel prebuilt must exist and not be a git-lfs pointer
          if [ ! -s prebuilt/kernel ] || head -c 40 prebuilt/kernel | grep -q "git-lfs"; then
            echo "::error::prebuilt/kernel missing or is an LFS pointer"; fail=1
          fi
          # 3. FOX_ vars are ignored inside .mk files
          if grep -nE '^\s*FOX_[A-Z_]+\s*:?=' ./*.mk; then
            echo "::warning::FOX_* variable set in a .mk file. OrangeFox ignores these; pass them via EXTRA_EXPORTS."
          fi
          exit $fail

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            gperf gcc-multilib g++-multilib libc6-dev lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libtinfo5 \
            lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
            qemu-user-static zip unzip rsync aria2 python3 curl git
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/local/bin/repo
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync OrangeFox sources
        env:
          FOX_BRANCH: ${{ inputs.FOX_BRANCH }}
        run: |
          set -o pipefail
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          git clone --depth 1 https://gitlab.com/OrangeFox/sync.git "$GITHUB_WORKSPACE/sync"
          cd "$GITHUB_WORKSPACE/sync"
          # --path must be ABSOLUTE
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$GITHUB_WORKSPACE/fox" 2>&1 \
            | tee "$GITHUB_WORKSPACE/sync.log"

      - name: Disk usage after sync
        run: df -h "$GITHUB_WORKSPACE"; free -h; du -sh "$GITHUB_WORKSPACE/fox" || true

      - name: Place device tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fox/${DEVICE_PATH}"
          rsync -a --exclude '.git' "$GITHUB_WORKSPACE/tree/" "$GITHUB_WORKSPACE/fox/${DEVICE_PATH}/"
          ls "$GITHUB_WORKSPACE/fox/${DEVICE_PATH}"

      - name: Build OrangeFox
        env:
          LUNCH_CHOICE: ${{ inputs.LUNCH_CHOICE }}
          BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
          EXTRA_EXPORTS: ${{ inputs.EXTRA_EXPORTS }}
        run: |
          cd "$GITHUB_WORKSPACE/fox"
          # envsetup/lunch return non-zero in harmless places, so don't let -e kill us
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="${DEVICE_NAME}"
          export LC_ALL=C
          for kv in $EXTRA_EXPORTS; do export "$kv"; done
          lunch "$LUNCH_CHOICE" || exit 1
          mka adbd "$BUILD_TARGET" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit "${PIPESTATUS[0]}"

      - name: Collect outputs
        if: success()
        run: |
          OUT="$GITHUB_WORKSPACE/fox/out/target/product/${DEVICE_NAME}"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -v "$OUT"/OrangeFox*.img "$OUT"/OrangeFox*.zip "$GITHUB_WORKSPACE/artifacts/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/artifacts"
          [ -n "$(ls -A "$GITHUB_WORKSPACE/artifacts")" ] || { echo "::error::No OrangeFox output found in $OUT"; ls -la "$OUT"; exit 1; }

      - name: Upload recovery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-${{ env.DEVICE_NAME }}
          path: artifacts/*
          retention-days: 14

      # Logs are what OrangeFox support will ask for, so always keep them
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            sync.log
            build.log
          if-no-files-found: ignore
          retention-days: 14

# ---------------------------------------------------------------------------
# NOTES
#  * Runner size: standard hosted runners are small (as far as I know ~2 vCPU/7 GB
#    RAM on private repos, ~4 vCPU/16 GB on public ones, and GitHub Pro does not
#    change that). A public fork is faster, and the OrangeFox wiki says a public
#    release of patched trees is required by the GPL anyway.
#  * The wiki's 85 GB / 32 GB RAM figures for 14.1 are for a local full sync. This
#    workflow merges root + temp disks and adds 16 GB swap, but whether the sync
#    fits and finishes inside 6 h is UNVERIFIED. Check "Disk usage after sync".
#  * Actions are pinned to major tags, not commit SHAs. For stricter supply-chain
#    safety, pin each to a SHA yourself.
# ---------------------------------------------------------------------------
